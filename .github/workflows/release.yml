name: Release

# This fork does not publish to npm. The upstream project owns the `@gethopp`
# scope, and claiming a name inside someone else's namespace is not ours to do,
# so the GitHub Release is the only distribution channel: it carries both the
# built plugin and the built server, with the server's runtime dependencies
# installed, so a user needs Node and nothing else.
#
# Every push to main that carries a new version publishes it. The version is
# not an input: it comes from the package.json files, which
# scripts/check-version.mjs requires to agree with each other and with an entry
# in CHANGELOG.md, and that entry becomes the release notes. A push whose
# version already has a release (a docs-only merge) builds and stops. The
# workflow creates the tag itself; nobody tags by hand.
#
# A manual run is a dry run unless `dry_run` is turned off, and it can only
# publish from main, so a branch can be packaged and inspected but never
# released past the PR gate.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only — do not create a GitHub Release"
        required: false
        default: true
        type: boolean

# Runs that can publish share one group, and `queue: max` keeps every pending one: the default
# keeps only the newest, so three quick merges would drop the middle release. Dry runs and branch
# runs get a group each, so they never wait on or replace a release.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.dry_run == false) && 'release-publish' || format('release-preview-{0}', github.run_id) }}
  queue: max

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Decides whether this run publishes, and why not when it does not.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(bun scripts/check-version.mjs)
          bun scripts/check-version.mjs --notes > release-notes.md
          printf '\n\n---\n\nDownload **figma-design-relay.zip** below. Setup and updating: [README → Quick Start](https://github.com/%s#quick-start).\n' \
            "$GITHUB_REPOSITORY" >> release-notes.md

          publish=true
          reason="publishing v$version"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            publish=false; reason="not main"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            publish=false; reason="dry run"
          # Only a published release with both assets is done. A failed run can
          # leave a draft or a release missing an asset; the release step finds it
          # and finishes it. "release not found" is the only other safe answer.
          elif state=$(gh release view "v$version" --json isDraft,assets --jq \
            'if .isDraft then "draft" elif ((["figma-design-relay.zip", "SHA256SUMS.txt"] - [.assets[].name]) | length) == 0 then "complete" else "incomplete" end' \
            2> release-error.txt); then
            if [ "$state" = "complete" ]; then
              publish=false; reason="already released"
            else
              reason="finishing v$version (an earlier run left it $state)"
            fi
          elif ! grep -q 'release not found' release-error.txt; then
            echo "ERROR: could not look up release v$version — re-run the workflow: $(cat release-error.txt)"
            exit 1
          fi

          # action-gh-release attaches to an existing tag wherever it points, so a
          # stray tag would put this release on the wrong commit.
          if [ "$publish" = "true" ]; then
            # A failed lookup must not read as "no tag": only a successful, empty
            # listing means the tag is absent.
            if ! refs=$(git ls-remote origin "refs/tags/v$version" "refs/tags/v$version^{}"); then
              echo "ERROR: could not list tag v$version on origin — re-run the workflow."
              exit 1
            fi
            # An annotated tag lists its own object and the commit it peels to (^{}).
            peeled=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/v$version^{}" '$2 == ref { print $1 }')
            plain=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/v$version" '$2 == ref { print $1 }')
            tag_sha=${peeled:-$plain}
            if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "ERROR: tag v$version points at $tag_sha, not this commit — bump the version or delete the stray tag."
              exit 1
            fi
          fi

          # Runs can finish out of order (a re-run of an older failed run, or queued
          # runs starting in another order), so only a newer version takes over
          # releases/latest; an older one is published but not marked latest.
          # Only a 404 means "no release yet"; any other failure stops the run, so a
          # lookup error can never let an older version become latest.
          latest=true
          if current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> latest-error.txt); then
            :
          elif grep -q 'HTTP 404' latest-error.txt; then
            current=""
          else
            echo "ERROR: could not read the latest release — re-run the workflow: $(cat latest-error.txt)"
            exit 1
          fi
          if [ -n "$current" ]; then
            newest=$(printf '%s\n%s\n' "${current#v}" "$version" | sort -V | tail -n 1)
            # Equal means finishing the release that is already latest: keep it so.
            if [ "$newest" != "$version" ]; then
              latest=false
              if [ "$publish" = "true" ]; then
                reason="publishing v$version (not latest: $current is newer)"
              fi
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "v$version: $reason"

      # ── Build ────────────────────────────────────────────────────────
      # CI's checkout has no .dev-slot.json, so both builds are the stable
      # relay on port 1994; package-release.mjs refuses anything else.

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Transpile server (tsc)
        working-directory: server
        run: bun run build

      - name: Install plugin dependencies
        working-directory: plugin
        run: bun install --frozen-lockfile

      # Runs the type-check first, so a release cannot ship code that does not
      # type-check.
      - name: Build Figma plugin
        working-directory: plugin
        run: bun run build

      # ── Package ──────────────────────────────────────────────────────

      # The archive's one top-level folder is unversioned, so unzipping an
      # update in the same place keeps the MCP config and Figma import valid.
      - name: Package release
        run: |
          bun scripts/package-release.mjs release
          (cd release && zip -qr ../figma-design-relay.zip figma-design-relay)
          sha256sum figma-design-relay.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Uploaded on every run, so a dry run still produces something inspectable.
      - name: Upload release archive as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: figma-design-relay-v${{ steps.decide.outputs.version }}
          path: |
            figma-design-relay.zip
            SHA256SUMS.txt
          if-no-files-found: error

      # The asset name never changes, so
      # releases/latest/download/figma-design-relay.zip is a permanent link.
      - name: Create GitHub Release
        if: ${{ steps.decide.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.decide.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Figma Design Relay v${{ steps.decide.outputs.version }}
          body_path: release-notes.md
          make_latest: ${{ steps.decide.outputs.latest }}
          fail_on_unmatched_files: true
          files: |
            figma-design-relay.zip
            SHA256SUMS.txt

      - name: Summary
        run: |
          {
            echo "### v${{ steps.decide.outputs.version }}: ${{ steps.decide.outputs.reason }}"
            echo ""
            if [ "${{ steps.decide.outputs.publish }}" = "true" ]; then
              echo "Published with \`figma-design-relay.zip\` and \`SHA256SUMS.txt\`."
            else
              echo "Built and packaged; no tag, no release. The archive is attached to this run as a build artifact."
            fi
            echo ""
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
