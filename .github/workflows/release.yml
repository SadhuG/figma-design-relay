name: Release

# This fork does not publish to npm. The upstream project owns the `@gethopp`
# scope, and claiming a name inside someone else's namespace is not ours to do,
# so the GitHub Release is the only distribution channel: it carries both the
# built plugin and the built server.
#
# `dry_run` defaults to true. A real release is an explicit opt-out, and the dry
# run exercises every step except tagging, so the workflow can be verified on
# real runners without publishing anything.
#
# The version is not an input. It comes from the package.json files, which
# scripts/check-version.mjs requires to agree with each other and with an entry
# in CHANGELOG.md; that entry becomes the release notes. Bump the version and
# write the entry in a commit first, then run this on the branch holding it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only — do not create a GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `server/src/version.ts` reads package.json at runtime and the MCP server
      # advertises that value, so the committed package.json is the version.
      - name: Read version and release notes
        id: version
        run: |
          version=$(bun scripts/check-version.mjs)
          bun scripts/check-version.mjs --notes > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (dry_run=${{ inputs.dry_run }})"

      # ── Server ───────────────────────────────────────────────────────

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Transpile server (tsc)
        working-directory: server
        run: bun run build

      - name: Verify CLI entry point
        working-directory: server
        run: |
          # Ensure the shebang is present for npx compatibility
          head -1 dist/index.js | grep -q '#!/usr/bin/env node' \
            || { echo "ERROR: dist/index.js is missing the node shebang"; exit 1; }
          echo "✓ Shebang present in dist/index.js"

      # ── Plugin ───────────────────────────────────────────────────────

      - name: Install plugin dependencies
        working-directory: plugin
        run: bun install --frozen-lockfile

      # Runs the type-check first, so a release cannot ship code that does not
      # type-check.
      - name: Build Figma plugin
        working-directory: plugin
        run: bun run build

      # ── Package ──────────────────────────────────────────────────────

      - name: Package release
        run: |
          mkdir -p release/plugin release/server

          # Built Figma plugin. manifest.json sits beside dist/ so its relative
          # `dist/code.js` and `dist/index.html` paths resolve on import.
          cp -r plugin/dist release/plugin/
          cp plugin/manifest.json release/plugin/

          # Built MCP server. dist/ alone is not runnable -- the dependencies are
          # not bundled -- so ship the manifest and lockfile for `bun install`.
          cp -r server/dist release/server/
          cp server/package.json release/server/
          cp server/bun.lock release/server/

          cp README.md release/
          cp CHANGELOG.md release/
          cp LICENSE.md release/

          cd release
          zip -r ../figma-design-relay-v${{ steps.version.outputs.version }}.zip .
          cd ..
          echo "Packaged:"
          unzip -l figma-design-relay-v${{ steps.version.outputs.version }}.zip

      # Uploaded on every run, so a dry run still produces something inspectable.
      - name: Upload release archive as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: figma-design-relay-v${{ steps.version.outputs.version }}
          path: figma-design-relay-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      # If the tag already exists (phase tags are pushed by hand), the release
      # attaches to it rather than creating a new one.
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: figma-design-relay-v${{ steps.version.outputs.version }}.zip

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "### Dry run complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built and packaged \`v${{ steps.version.outputs.version }}\`. No tag, no release, nothing published." >> $GITHUB_STEP_SUMMARY
          echo "The archive is attached to this run as a build artifact." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat release-notes.md >> $GITHUB_STEP_SUMMARY
